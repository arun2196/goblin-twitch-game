<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Gobbo Games Chest Reveal</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="reveal-stage">
    <div
      id="card-wrapper"
      class="card-wrapper"
      aria-hidden="true"
    >
      <div class="card-inner">
        <div class="card-face card-back">
          <img
            id="card-back-image"
            alt="Gobbo Games card back"
          >
        </div>

        <div class="card-face card-front">
          <img
            id="revealed-card"
            alt="Revealed Gobbo card"
          >
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
